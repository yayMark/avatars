<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avatar Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      padding: 2rem;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: #333;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group.full {
      grid-column: 1 / -1;
    }
    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: #666;
      margin-bottom: 0.5rem;
    }
    input {
      padding: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: #0066cc;
      box-shadow: 0 0 0 2px rgba(0,102,204,0.1);
    }
    select {
      padding: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
      font-family: inherit;
    }
    select:focus {
      outline: none;
      border-color: #0066cc;
      box-shadow: 0 0 0 2px rgba(0,102,204,0.1);
    }
    .preview {
      display: flex;
      justify-content: center;
      margin: 2rem 0;
      padding: 2rem;
      background: #fafafa;
      border-radius: 8px;
    }
    svg {
      max-width: 200px;
      width: 100%;
      height: auto;
    }
    .buttons {
      display: flex;
      gap: 1rem;
    }
    button {
      flex: 1;
      padding: 0.75rem;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 500;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background: #0052a3;
    }
    button.secondary {
      background: #666;
    }
    button.secondary:hover {
      background: #555;
    }
    .preset-section {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid #ddd;
    }
    .preset-controls {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .preset-controls input {
      flex: 1;
    }
    .preset-controls button {
      flex: 0 0 auto;
      padding: 0.5rem 1rem;
    }
    .presets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 1rem;
    }
    .preset-item {
      position: relative;
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      background: #f9f9f9;
      border: 2px solid transparent;
      transition: border-color 0.2s;
    }
    .preset-item:hover {
      border-color: #0066cc;
    }
    .preset-item svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .preset-delete {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(255,0,0,0.8);
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      padding: 0;
      font-size: 12px;
      cursor: pointer;
      display: none;
    }
    .preset-item:hover .preset-delete {
      display: block;
    }
    .preset-delete:hover {
      background: rgba(255,0,0,1);
    }
    .preset-label {
      font-size: 0.75rem;
      text-align: center;
      padding: 0.25rem;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Avatar Generator</h1>

    <div class="grid">
      <div class="form-group">
        <label for="initials">Initials</label>
        <input type="text" id="initials" value="MH" maxlength="2" placeholder="AB">
      </div>
      <div class="form-group">
        <label for="size">Size (px)</label>
        <input type="number" id="size" value="200" min="50" max="500">
      </div>
      <div class="form-group">
        <label for="bgColor">Background</label>
        <input type="text" id="bgColor" value="#C8102E" placeholder="#C8102E">
      </div>
      <div class="form-group">
        <label for="circleColor">Circle</label>
        <input type="text" id="circleColor" value="white" placeholder="white">
      </div>
      <div class="form-group">
        <label for="textColor">Text</label>
        <input type="text" id="textColor" value="#C8102E" placeholder="#C8102E">
      </div>
      <div class="form-group">
        <label for="inset">Inset %</label>
        <input type="number" id="inset" value="10" min="0" max="50" step="1">
      </div>
      <div class="form-group">
        <label for="fontSize">Font Size (×)</label>
        <input type="number" id="fontSize" value="1" min="0.5" max="2" step="0.1">
      </div>
      <div class="form-group">
        <label for="fontFamily">Font</label>
        <select id="fontFamily">
          <option value="Arial">Arial</option>
          <option value="Helvetica">Helvetica</option>
          <option value="Georgia">Georgia</option>
          <option value="'Courier New'">Courier New</option>
          <option value="Verdana">Verdana</option>
          <option value="Trebuchet MS">Trebuchet MS</option>
        </select>
      </div>
    </div>

    <div class="preview">
      <svg id="preview" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div class="buttons">
      <button onclick="downloadSVG()">Download SVG</button>
      <button class="secondary" onclick="downloadPNG()">Download PNG</button>
    </div>

    <div class="preset-section">
      <h2 style="font-size: 1.125rem; margin-bottom: 1rem; color: #333;">Presets</h2>
      <div class="preset-controls">
        <input type="text" id="presetName" placeholder="Name this preset..." maxlength="20">
        <button onclick="savePreset()" style="flex: 0 0 auto;">Save Preset</button>
      </div>
      <div class="presets-grid" id="presetsGrid"></div>
    </div>
  </div>

  <script>
    const PRESETS_KEY = 'avatarPresets';

    function getPresets() {
      const stored = localStorage.getItem(PRESETS_KEY);
      return stored ? JSON.parse(stored) : {};
    }

    function savePreset() {
      const name = document.getElementById('presetName').value.trim();
      if (!name) {
        alert('Enter a preset name');
        return;
      }

      const preset = {
        initials: document.getElementById('initials').value,
        bgColor: document.getElementById('bgColor').value,
        circleColor: document.getElementById('circleColor').value,
        textColor: document.getElementById('textColor').value,
        size: document.getElementById('size').value,
        inset: document.getElementById('inset').value,
        fontSize: document.getElementById('fontSize').value,
        fontFamily: document.getElementById('fontFamily').value
      };

      const presets = getPresets();
      presets[name] = preset;
      localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));
      document.getElementById('presetName').value = '';
      renderPresets();
    }

    function loadPreset(name) {
      const presets = getPresets();
      const preset = presets[name];
      if (!preset) return;

      document.getElementById('initials').value = preset.initials;
      document.getElementById('bgColor').value = preset.bgColor;
      document.getElementById('circleColor').value = preset.circleColor;
      document.getElementById('textColor').value = preset.textColor;
      document.getElementById('size').value = preset.size;
      document.getElementById('inset').value = preset.inset;
      document.getElementById('fontSize').value = preset.fontSize;
      document.getElementById('fontFamily').value = preset.fontFamily;
      updatePreview();
    }

    function deletePreset(name, evt) {
      evt.stopPropagation();
      if (confirm(`Delete preset "${name}"?`)) {
        const presets = getPresets();
        delete presets[name];
        localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));
        renderPresets();
      }
    }

    function renderPresets() {
      const presets = getPresets();
      const grid = document.getElementById('presetsGrid');
      grid.innerHTML = '';

      Object.keys(presets).forEach(name => {
        const preset = presets[name];
        const item = document.createElement('div');
        item.className = 'preset-item';
        item.onclick = () => loadPreset(name);

        const svgContent = generateSVG(preset.initials, preset.bgColor, preset.circleColor, preset.textColor, 60, preset.inset / 100, preset.fontFamily, preset.fontSize);
        const svgHTML = `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">${svgContent}</svg>`;

        item.innerHTML = svgHTML + `<div class="preset-label">${name}</div><button class="preset-delete" onclick="deletePreset('${name}', event)">×</button>`;
        grid.appendChild(item);
      });
    }

    function generateSVG(initials, bgColor, circleColor, textColor, size = 200, inset = 0.1, fontFamily = 'Arial', fontSizeMultiplier = 1) {
      const radius = (size / 2) * (1 - inset);
      const baseFontSize = size * 0.33;
      const fontSize = baseFontSize * fontSizeMultiplier;
      const textY = size / 2 + (fontSize * 0.35);

      return `<rect width="${size}" height="${size}" fill="${bgColor}"/>
  <circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="${circleColor}"/>
  <text x="${size / 2}" y="${textY}" font-family="${fontFamily}" font-weight="bold" font-size="${fontSize}" fill="${textColor}" text-anchor="middle">${initials}</text>`;
    }

    function updatePreview() {
      const initials = document.getElementById('initials').value || 'AB';
      const bgColor = document.getElementById('bgColor').value;
      const circleColor = document.getElementById('circleColor').value;
      const textColor = document.getElementById('textColor').value;
      const size = parseInt(document.getElementById('size').value);
      const inset = parseInt(document.getElementById('inset').value) / 100;
      const fontFamily = document.getElementById('fontFamily').value;
      const fontSizeMultiplier = parseFloat(document.getElementById('fontSize').value);

      const svg = document.getElementById('preview');
      svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
      svg.innerHTML = generateSVG(initials, bgColor, circleColor, textColor, size, inset, fontFamily, fontSizeMultiplier);
    }

    function downloadSVG() {
      const initials = document.getElementById('initials').value || 'AB';
      const size = parseInt(document.getElementById('size').value);
      const bgColor = document.getElementById('bgColor').value;
      const circleColor = document.getElementById('circleColor').value;
      const textColor = document.getElementById('textColor').value;
      const inset = parseInt(document.getElementById('inset').value) / 100;
      const fontFamily = document.getElementById('fontFamily').value;
      const fontSizeMultiplier = parseFloat(document.getElementById('fontSize').value);

      const svgContent = generateSVG(initials, bgColor, circleColor, textColor, size, inset, fontFamily, fontSizeMultiplier);
      const svgString = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">\n  ${svgContent}\n</svg>`;
      const blob = new Blob([svgString], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `avatar-${initials}.svg`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function downloadPNG() {
      const initials = document.getElementById('initials').value || 'AB';
      const size = parseInt(document.getElementById('size').value);
      const bgColor = document.getElementById('bgColor').value;
      const circleColor = document.getElementById('circleColor').value;
      const textColor = document.getElementById('textColor').value;
      const inset = parseInt(document.getElementById('inset').value) / 100;
      const fontFamily = document.getElementById('fontFamily').value;
      const fontSizeMultiplier = parseFloat(document.getElementById('fontSize').value);

      const svgContent = generateSVG(initials, bgColor, circleColor, textColor, size, inset, fontFamily, fontSizeMultiplier);
      const svgString = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">\n  ${svgContent}\n</svg>`;
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `avatar-${initials}.png`;
          a.click();
          URL.revokeObjectURL(url);
        });
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(svgString);
    }

    // Attach listeners
    ['initials', 'bgColor', 'circleColor', 'textColor', 'size', 'inset', 'fontSize', 'fontFamily'].forEach(id => {
      document.getElementById(id).addEventListener('change', updatePreview);
      document.getElementById(id).addEventListener('input', updatePreview);
    });

    // Initial render
    updatePreview();
    renderPresets();
  </script>
</body>
</html>
