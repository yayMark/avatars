<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avatar Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      padding: 2rem;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: #333;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group.full {
      grid-column: 1 / -1;
    }
    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: #666;
      margin-bottom: 0.5rem;
    }
    input {
      padding: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: #0066cc;
      box-shadow: 0 0 0 2px rgba(0,102,204,0.1);
    }
    .preview {
      display: flex;
      justify-content: center;
      margin: 2rem 0;
      padding: 2rem;
      background: #fafafa;
      border-radius: 8px;
    }
    svg {
      max-width: 200px;
      width: 100%;
      height: auto;
    }
    .buttons {
      display: flex;
      gap: 1rem;
    }
    button {
      flex: 1;
      padding: 0.75rem;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 500;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background: #0052a3;
    }
    button.secondary {
      background: #666;
    }
    button.secondary:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Avatar Generator</h1>

    <div class="grid">
      <div class="form-group">
        <label for="initials">Initials</label>
        <input type="text" id="initials" value="MH" maxlength="2" placeholder="AB">
      </div>
      <div class="form-group">
        <label for="size">Size (px)</label>
        <input type="number" id="size" value="200" min="50" max="500">
      </div>
      <div class="form-group">
        <label for="bgColor">Background</label>
        <input type="text" id="bgColor" value="#C8102E" placeholder="#C8102E">
      </div>
      <div class="form-group">
        <label for="circleColor">Circle</label>
        <input type="text" id="circleColor" value="white" placeholder="white">
      </div>
      <div class="form-group">
        <label for="textColor">Text</label>
        <input type="text" id="textColor" value="#C8102E" placeholder="#C8102E">
      </div>
      <div class="form-group">
        <label for="inset">Inset %</label>
        <input type="number" id="inset" value="10" min="0" max="50" step="1">
      </div>
    </div>

    <div class="preview">
      <svg id="preview" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div class="buttons">
      <button onclick="downloadSVG()">Download SVG</button>
      <button class="secondary" onclick="downloadPNG()">Download PNG</button>
    </div>
  </div>

  <script>
    function generateSVG(initials, bgColor, circleColor, textColor, size = 200, inset = 0.1) {
      const radius = (size / 2) * (1 - inset);
      const fontSize = size * 0.33;
      const textY = size / 2 + (fontSize * 0.35);

      return `<rect width="${size}" height="${size}" fill="${bgColor}"/>
  <circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="${circleColor}"/>
  <text x="${size / 2}" y="${textY}" font-family="Arial" font-weight="bold" font-size="${fontSize}" fill="${textColor}" text-anchor="middle">${initials}</text>`;
    }

    function updatePreview() {
      const initials = document.getElementById('initials').value || 'AB';
      const bgColor = document.getElementById('bgColor').value;
      const circleColor = document.getElementById('circleColor').value;
      const textColor = document.getElementById('textColor').value;
      const size = parseInt(document.getElementById('size').value);
      const inset = parseInt(document.getElementById('inset').value) / 100;

      const svg = document.getElementById('preview');
      svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
      svg.innerHTML = generateSVG(initials, bgColor, circleColor, textColor, size, inset);
    }

    function downloadSVG() {
      const initials = document.getElementById('initials').value || 'AB';
      const size = parseInt(document.getElementById('size').value);
      const svg = document.getElementById('preview');

      const svgString = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">\n  ${svg.innerHTML}\n</svg>`;
      const blob = new Blob([svgString], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `avatar-${initials}.svg`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function downloadPNG() {
      const initials = document.getElementById('initials').value || 'AB';
      const size = parseInt(document.getElementById('size').value);
      const svg = document.getElementById('preview');

      const svgString = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">\n  ${svg.innerHTML}\n</svg>`;
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `avatar-${initials}.png`;
          a.click();
          URL.revokeObjectURL(url);
        });
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(svgString);
    }

    // Attach listeners
    ['initials', 'bgColor', 'circleColor', 'textColor', 'size', 'inset'].forEach(id => {
      document.getElementById(id).addEventListener('change', updatePreview);
      document.getElementById(id).addEventListener('input', updatePreview);
    });

    // Initial render
    updatePreview();
  </script>
</body>
</html>
